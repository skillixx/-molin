        run: bash infra/scripts/verify-ai-gateway-migration-000062.sh

  gateway-g4:
    name: AI 网关 G4 安全与资源治理验收
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.gateway_g4 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 隔离验证 MySQL 8、Redis 7 与 RabbitMQ 恢复
        env:
