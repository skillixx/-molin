          docker run --rm --entrypoint=/bin/promtool \
            --workdir=/etc/prometheus \
            -v "${{ github.workspace }}/infra/prometheus/ai-gateway-production.yml:/etc/prometheus/ai-gateway-production.yml:ro" \
            -v "${{ github.workspace }}/infra/prometheus/ai-gateway-alerts.yml:/etc/prometheus/rules/ai-gateway-alerts.yml:ro" \
            -v "${{ github.workspace }}/infra/prometheus/targets:/etc/prometheus/targets:ro" \
            prom/prometheus:v3.12.0-distroless \
            check config ai-gateway-production.yml
          docker run --rm --entrypoint=/bin/amtool \
            --workdir=/config \
            -v "${{ github.workspace }}/infra/alertmanager:/config:ro" \
            prom/alertmanager:v0.28.1 \
            check-config ai-gateway-g8.yml
          bash infra/scripts/verify-ai-gateway-g8-alert-routing.sh

