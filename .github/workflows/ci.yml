  gateway-g8-windows:
    name: AI 网关 G8 Windows 本地诊断门禁
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.gateway_g8 == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 验证 Windows 可信系统目录与失效入口失败关闭
        shell: pwsh
        run: |
          python -I -W error::ResourceWarning infra/scripts/test_diagnose_ai_gateway_g8_local_ssh_materials.py -v
          python -I -W error::ResourceWarning infra/scripts/test_run_ai_gateway_g8_test_drop_staging_evidence_013.py -v
          python -I -W error::ResourceWarning infra/scripts/test_run_ai_gateway_g8_test_drop_staging_evidence_014.py -v
          python -I -m py_compile infra/scripts/diagnose-ai-gateway-g8-local-ssh-materials.py infra/scripts/run-ai-gateway-g8-test-drop-staging-evidence-013.py infra/scripts/run-ai-gateway-g8-test-drop-staging-evidence-014.py
          python -I infra/scripts/diagnose-ai-gateway-g8-local-ssh-materials.py --self-test
          $g8ConsumedOutput = & python -I infra/scripts/run-ai-gateway-g8-test-drop-staging-evidence-013.py --self-test 2>&1
          if ($LASTEXITCODE -ne 2 -or [string]$g8ConsumedOutput -cne 'G8_TEST_READONLY_DROP_STAGING_EVIDENCE_013=FAILED reason=change_id_consumed') {
            throw '013 失效入口未在 Windows 门禁中失败关闭'
          }
          $g8Consumed014Output = & python -I infra/scripts/run-ai-gateway-g8-test-drop-staging-evidence-014.py --self-test 2>&1
          if ($LASTEXITCODE -ne 2 -or [string]$g8Consumed014Output -cne 'G8_TEST_READONLY_DROP_STAGING_EVIDENCE_014=FAILED reason=change_id_consumed') {
            throw '014 已消费入口未在 Windows 门禁中失败关闭'
          }

  gateway-g8-real-e2e:
    name: AI 网关 G8 真实后端浏览器验收
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.gateway_g8_real_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/admin-console/package-lock.json
            web/user-console/package-lock.json

      - name: 安装双端依赖与浏览器
        run: |
          npm ci --prefix web/admin-console
          npm ci --prefix web/user-console

      - name: 安装 Chromium
        working-directory: web/admin-console
        run: npx playwright install --with-deps chrome

      - name: 执行无 Mock 的真实后端写入与调用链路
        env:
          AI_GATEWAY_G8_ISOLATED_APPROVED: YES
        run: |
          bash -n infra/scripts/verify-ai-gateway-g8-real-backend-e2e.sh
          bash infra/scripts/verify-ai-gateway-g8-real-backend-e2e.sh

  # ---- 前端 CI ----
  frontend-admin:
    name: 管理后台构建
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.frontend_admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        working-directory: web/admin-console
        run: npm install

      - name: 管理后台阶段 4 契约测试
        working-directory: web/admin-console
        run: |
          npm run test:sms-management
          npm run test:admin-verification
          npm run test:email-management
          npm run test:vite-isolation
          npm run test:outbound-url

      - name: TypeScript 类型检查
        working-directory: web/admin-console
        run: npm run type-check

      - name: ESLint 检查
        working-directory: web/admin-console
        run: npm run lint

      - name: 生产构建
        working-directory: web/admin-console
        run: npm run build

  frontend-user:
    name: 用户控制台构建
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.frontend_user == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装依赖
        working-directory: web/user-console
        run: npm install

      - name: 用户控制台阶段 4 契约测试
        working-directory: web/user-console
        run: |
          npm run test:sms
          npm run test:email-otp
          npm run test:vite-isolation

      - name: TypeScript 类型检查
        working-directory: web/user-console
        run: npm run type-check

      - name: ESLint 检查
        working-directory: web/user-console
        run: npm run lint

      - name: 生产构建
        working-directory: web/user-console
        run: npm run build

      - name: G6 用户完整链路浏览器验收
        working-directory: web/user-console
        run: |
          npx playwright install --with-deps chrome
          npm run test:g6-e2e

  ci-required-gate:
    name: CI 必选门禁汇总
    needs:
      - change-scope
      - docs-lightweight
      - backend
      - phase5-release-safety
      - gateway-g3
      - gateway-g4
      - gateway-g7
      - gateway-g8
      - gateway-g8-windows
      - gateway-g8-real-e2e
      - frontend-admin
      - frontend-user
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 校验分类结果与适用门禁
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          FULL_REQUIRED: ${{ needs.change-scope.outputs.full }}
          DOCS_REQUIRED: ${{ needs.change-scope.outputs.docs_lightweight }}
          DOCS_RESULT: ${{ needs.docs-lightweight.result }}
          BACKEND_REQUIRED: ${{ needs.change-scope.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PHASE5_REQUIRED: ${{ needs.change-scope.outputs.phase5 }}
          PHASE5_RESULT: ${{ needs.phase5-release-safety.result }}
          G3_REQUIRED: ${{ needs.change-scope.outputs.gateway_g3 }}
          G3_RESULT: ${{ needs.gateway-g3.result }}
          G4_REQUIRED: ${{ needs.change-scope.outputs.gateway_g4 }}
          G4_RESULT: ${{ needs.gateway-g4.result }}
          G7_REQUIRED: ${{ needs.change-scope.outputs.gateway_g7 }}
          G7_RESULT: ${{ needs.gateway-g7.result }}
          G8_REQUIRED: ${{ needs.change-scope.outputs.gateway_g8 }}
          G8_RESULT: ${{ needs.gateway-g8.result }}
          G8_WINDOWS_RESULT: ${{ needs.gateway-g8-windows.result }}
          G8_E2E_REQUIRED: ${{ needs.change-scope.outputs.gateway_g8_real_e2e }}
          G8_E2E_RESULT: ${{ needs.gateway-g8-real-e2e.result }}
          ADMIN_REQUIRED: ${{ needs.change-scope.outputs.frontend_admin }}
          ADMIN_RESULT: ${{ needs.frontend-admin.result }}
          USER_REQUIRED: ${{ needs.change-scope.outputs.frontend_user }}
          USER_RESULT: ${{ needs.frontend-user.result }}
        run: |
          test "$CHANGE_SCOPE_RESULT" = "success"
          for value in \
            "$FULL_REQUIRED" "$DOCS_REQUIRED" "$BACKEND_REQUIRED" "$PHASE5_REQUIRED" \
            "$G3_REQUIRED" "$G4_REQUIRED" "$G7_REQUIRED" "$G8_REQUIRED" \
            "$G8_E2E_REQUIRED" "$ADMIN_REQUIRED" "$USER_REQUIRED"; do
            case "$value" in
              true|false) ;;
              *) printf 'CI 分类输出不是布尔值\n'; exit 1 ;;
            esac
          done
          selected_gate=false
          for value in \
            "$DOCS_REQUIRED" "$BACKEND_REQUIRED" "$PHASE5_REQUIRED" "$G3_REQUIRED" \
            "$G4_REQUIRED" "$G7_REQUIRED" "$G8_REQUIRED" "$G8_E2E_REQUIRED" \
            "$ADMIN_REQUIRED" "$USER_REQUIRED"; do
            if [ "$value" = "true" ]; then
              selected_gate=true
            fi
          done
          test "$selected_gate" = "true"
          if [ "$FULL_REQUIRED" = "true" ]; then
            test "$DOCS_REQUIRED" = "true"
            test "$BACKEND_REQUIRED" = "true"
            test "$PHASE5_REQUIRED" = "true"
            test "$G3_REQUIRED" = "true"
            test "$G4_REQUIRED" = "true"
            test "$G7_REQUIRED" = "true"
            test "$G8_REQUIRED" = "true"
            test "$G8_E2E_REQUIRED" = "true"
            test "$ADMIN_REQUIRED" = "true"
            test "$USER_REQUIRED" = "true"
          fi
          check_required_gate() {
            local required="$1"
            local result="$2"
            local gate_name="$3"
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              printf '必选 CI 门禁未成功：%s result=%s\n' "$gate_name" "$result"
              return 1
            fi
          }
          check_required_gate "$DOCS_REQUIRED" "$DOCS_RESULT" "docs-lightweight"
          check_required_gate "$BACKEND_REQUIRED" "$BACKEND_RESULT" "backend"
          check_required_gate "$PHASE5_REQUIRED" "$PHASE5_RESULT" "phase5-release-safety"
          check_required_gate "$G3_REQUIRED" "$G3_RESULT" "gateway-g3"
          check_required_gate "$G4_REQUIRED" "$G4_RESULT" "gateway-g4"
          check_required_gate "$G7_REQUIRED" "$G7_RESULT" "gateway-g7"
          check_required_gate "$G8_REQUIRED" "$G8_RESULT" "gateway-g8"
          check_required_gate "$G8_REQUIRED" "$G8_WINDOWS_RESULT" "gateway-g8-windows"
          check_required_gate "$G8_E2E_REQUIRED" "$G8_E2E_RESULT" "gateway-g8-real-e2e"
          check_required_gate "$ADMIN_REQUIRED" "$ADMIN_RESULT" "frontend-admin"
          check_required_gate "$USER_REQUIRED" "$USER_RESULT" "frontend-user"
