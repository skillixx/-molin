    name: AI 网关 G3 财务与消息验收
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.gateway_g3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
