name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: CI 变更范围分类
    runs-on: ubuntu-latest
    outputs:
      pr_mode: ${{ steps.scope.outputs.pr_mode }}
      draft_docs: ${{ steps.scope.outputs.draft_docs }}
      draft_python: ${{ steps.scope.outputs.draft_python }}
      draft_backend: ${{ steps.scope.outputs.draft_backend }}
      draft_frontend_admin: ${{ steps.scope.outputs.draft_frontend_admin }}
      draft_frontend_user: ${{ steps.scope.outputs.draft_frontend_user }}
      python_tests_json: ${{ steps.targets.outputs.python_tests_json }}
      python_compile_json: ${{ steps.targets.outputs.python_compile_json }}
      go_packages_json: ${{ steps.targets.outputs.go_packages_json }}
      docs_lightweight: ${{ steps.scope.outputs.docs_lightweight }}
      backend: ${{ steps.scope.outputs.backend }}
      phase5: ${{ steps.scope.outputs.phase5 }}
      gateway_g3: ${{ steps.scope.outputs.gateway_g3 }}
      gateway_g4: ${{ steps.scope.outputs.gateway_g4 }}
      gateway_g7: ${{ steps.scope.outputs.gateway_g7 }}
      gateway_g8: ${{ steps.scope.outputs.gateway_g8 }}
      gateway_g8_real_e2e: ${{ steps.scope.outputs.gateway_g8_real_e2e }}
      frontend_admin: ${{ steps.scope.outputs.frontend_admin }}
      frontend_user: ${{ steps.scope.outputs.frontend_user }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 精确比较 PR 基线与头提交，不能依赖浅克隆猜测变更范围。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 校验并执行 CI 变更范围分类
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MODE: ${{ github.event.pull_request.draft && 'draft' || 'ready' }}
        run: |
          python -I -W error::ResourceWarning infra/scripts/test_classify_ci_change_scope.py -v
          python -I -W error::ResourceWarning infra/scripts/test_select_ci_draft_tests.py -v
          python -I -W error::ResourceWarning infra/scripts/test_run_ci_draft_targets.py -v
          python -I -W error::ResourceWarning infra/scripts/test_ci_draft_ready_workflow_contract.py -v
          python -m py_compile \
            infra/scripts/classify-ci-change-scope.py \
            infra/scripts/select-ci-draft-tests.py \
            infra/scripts/run-ci-draft-targets.py \
            infra/scripts/test_classify_ci_change_scope.py \
            infra/scripts/test_select_ci_draft_tests.py \
            infra/scripts/test_run_ci_draft_targets.py \
            infra/scripts/test_ci_draft_ready_workflow_contract.py
          python infra/scripts/classify-ci-change-scope.py \
            --base-sha="$BASE_SHA" \
            --head-sha="$HEAD_SHA" \
            --repo-root=. \
            --pr-mode="$PR_MODE" \
            --github-output="$GITHUB_OUTPUT"

      - name: 安装 Go 以选择 Draft package
        if: github.event.pull_request.draft == true && steps.scope.outputs.draft_backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 选择 Draft 定向测试目标
        id: targets
        if: github.event.pull_request.draft == true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python infra/scripts/select-ci-draft-tests.py \
            --base-sha="$BASE_SHA" \
            --head-sha="$HEAD_SHA" \
            --repo-root=. \
            --github-output="$GITHUB_OUTPUT"

  draft-quality:
    name: Draft 基础质量门禁
    needs: change-scope
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 校验差异格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: 扫描差异敏感信息
        run: python scripts/verify-sms-phase5-sensitive-data.py --repo-root . --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: 验证分类与选择器基础契约
        run: |
          python -I -W error::ResourceWarning infra/scripts/test_classify_ci_change_scope.py -v
          python -m py_compile \
            infra/scripts/classify-ci-change-scope.py \
            infra/scripts/select-ci-draft-tests.py \
            infra/scripts/run-ci-draft-targets.py

      - name: 安装 Go 以校验工作流
        if: needs.change-scope.outputs.draft_python == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: 校验 GitHub Actions 工作流
        if: needs.change-scope.outputs.draft_python == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  draft-python:
    name: Draft Python 定向门禁
    needs: change-scope
    if: github.event.pull_request.draft == true && needs.change-scope.outputs.draft_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 运行选中的 Python 测试
        env:
          TARGETS_JSON: ${{ needs.change-scope.outputs.python_tests_json }}
        run: python infra/scripts/run-ci-draft-targets.py --kind=python-tests --targets-json="$TARGETS_JSON" --repo-root=.

      - name: 编译选中的 Python 文件
        if: needs.change-scope.outputs.python_compile_json != '[]'
        env:
          TARGETS_JSON: ${{ needs.change-scope.outputs.python_compile_json }}
        run: python infra/scripts/run-ci-draft-targets.py --kind=python-compile --targets-json="$TARGETS_JSON" --repo-root=.

  draft-backend:
    name: Draft 后端定向门禁
    needs: change-scope
    if: github.event.pull_request.draft == true && needs.change-scope.outputs.draft_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 校验模块依赖
        working-directory: server
        run: go mod verify

      - name: 运行选中的 Go package
        env:
          TARGETS_JSON: ${{ needs.change-scope.outputs.go_packages_json }}
        run: python infra/scripts/run-ci-draft-targets.py --kind=go --targets-json="$TARGETS_JSON" --repo-root=.

  draft-frontend-admin:
    name: Draft 管理后台定向门禁
    needs: change-scope
    if: github.event.pull_request.draft == true && needs.change-scope.outputs.draft_frontend_admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/admin-console/package-lock.json

      - name: 安装依赖
        working-directory: web/admin-console
        run: npm ci

      - name: 运行管理后台契约测试
        working-directory: web/admin-console
        run: |
          npm run test:sms-management
          npm run test:admin-verification
          npm run test:email-management
          npm run test:vite-isolation
          npm run test:outbound-url

      - name: TypeScript 类型检查
        working-directory: web/admin-console
        run: npm run type-check

  draft-frontend-user:
    name: Draft 用户控制台定向门禁
    needs: change-scope
    if: github.event.pull_request.draft == true && needs.change-scope.outputs.draft_frontend_user == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/user-console/package-lock.json

      - name: 安装依赖
        working-directory: web/user-console
        run: npm ci

      - name: 运行用户控制台契约测试
        working-directory: web/user-console
        run: |
          npm run test:sms
          npm run test:email-otp
          npm run test:vite-isolation

      - name: TypeScript 类型检查
        working-directory: web/user-console
        run: npm run type-check

  ci-draft-gate:
    name: CI Draft 快速门禁汇总
    needs:
      - change-scope
      - draft-quality
      - draft-python
      - draft-backend
      - draft-frontend-admin
      - draft-frontend-user
    if: always() && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: 校验 Draft 分类与定向门禁
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          PR_MODE: ${{ needs.change-scope.outputs.pr_mode }}
          QUALITY_RESULT: ${{ needs.draft-quality.result }}
          DRAFT_DOCS_REQUIRED: ${{ needs.change-scope.outputs.draft_docs }}
          PYTHON_REQUIRED: ${{ needs.change-scope.outputs.draft_python }}
          PYTHON_RESULT: ${{ needs.draft-python.result }}
          BACKEND_REQUIRED: ${{ needs.change-scope.outputs.draft_backend }}
          BACKEND_RESULT: ${{ needs.draft-backend.result }}
          ADMIN_REQUIRED: ${{ needs.change-scope.outputs.draft_frontend_admin }}
          ADMIN_RESULT: ${{ needs.draft-frontend-admin.result }}
          USER_REQUIRED: ${{ needs.change-scope.outputs.draft_frontend_user }}
          USER_RESULT: ${{ needs.draft-frontend-user.result }}
        run: |
          test "$CHANGE_SCOPE_RESULT" = "success"
          test "$PR_MODE" = "draft"
          test "$QUALITY_RESULT" = "success"
          for value in "$DRAFT_DOCS_REQUIRED" "$PYTHON_REQUIRED" "$BACKEND_REQUIRED" "$ADMIN_REQUIRED" "$USER_REQUIRED"; do
            case "$value" in
              true|false) ;;
              *) printf 'Draft CI 分类输出不是布尔值\n'; exit 1 ;;
            esac
          done
          selected_gate=false
          for value in "$DRAFT_DOCS_REQUIRED" "$PYTHON_REQUIRED" "$BACKEND_REQUIRED" "$ADMIN_REQUIRED" "$USER_REQUIRED"; do
            if [ "$value" = "true" ]; then
              selected_gate=true
            fi
          done
          test "$selected_gate" = "true"
          check_required_gate() {
            local required="$1"
            local result="$2"
            local gate_name="$3"
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              printf 'Draft 定向门禁未成功：%s result=%s\n' "$gate_name" "$result"
              return 1
            fi
            if [ "$required" = "false" ] && [ "$result" != "skipped" ]; then
              printf '未选 Draft 门禁状态异常：%s result=%s\n' "$gate_name" "$result"
              return 1
            fi
          }
          check_required_gate "$PYTHON_REQUIRED" "$PYTHON_RESULT" "draft-python"
          check_required_gate "$BACKEND_REQUIRED" "$BACKEND_RESULT" "draft-backend"
          check_required_gate "$ADMIN_REQUIRED" "$ADMIN_RESULT" "draft-frontend-admin"
          check_required_gate "$USER_REQUIRED" "$USER_RESULT" "draft-frontend-user"
          printf 'Draft 快速门禁通过；该结果不能替代 Ready 完整门禁。\n'

  docs-lightweight:
    name: 文档与基础质量轻量门禁
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.docs_lightweight == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 校验差异格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: 扫描差异敏感信息
        run: python scripts/verify-sms-phase5-sensitive-data.py --repo-root . --base-ref "${{ github.event.pull_request.base.sha }}"

  # ---- 后端 CI ----
  backend:
    name: 后端构建与测试
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: molin_sms_test_ci
          MYSQL_USER: molin
          MYSQL_PASSWORD: molin_password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-retries=3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 安装依赖
        working-directory: server
        run: go mod download

      - name: 校验模块依赖
        working-directory: server
        run: go mod verify

      - name: 校验 GitHub Actions 工作流
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: 代码检查（go vet）
        working-directory: server
        run: go vet ./...

      - name: 运行单元测试
        working-directory: server
        env:
          APP_ENV: test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: molin_sms_test_ci
          MYSQL_USER: molin
          MYSQL_PASSWORD: molin_password
          REDIS_ADDR: 127.0.0.1:6379
          JWT_SECRET: test_jwt_secret_for_ci_only_32chars
          REFRESH_TOKEN_SECRET: test_refresh_secret_for_ci_32chars
          ID_CARD_HMAC_SECRET: test_hmac_secret_for_ci_only_32c
          SMS_MIGRATION_TEST_DSN: "molin:molin_password@tcp(127.0.0.1:3306)/molin_sms_test_ci?parseTime=true&multiStatements=true"
          SMS_REDIS_INTEGRATION_TEST: "1"
        run: go test -v -race -count=1 ./...

      - name: 构建确认
        working-directory: server
        run: go build -o /dev/null ./cmd/api

      - name: 隔离验证 G6 MySQL 8 迁移
        env:
          AI_GATEWAY_G6_ISOLATED_APPROVED: "YES"
          G6_DOCKER_PULL_POLICY: missing
        run: bash infra/scripts/verify-ai-gateway-g6-customer.sh

  phase5-release-safety:
    name: 阶段 5 短信发布安全门禁
    needs: change-scope
    if: github.event.pull_request.draft == false && needs.change-scope.outputs.phase5 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 敏感信息门禁需要比较阶段分支与主分支的完整共同基线。
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/admin-console/package-lock.json
            web/user-console/package-lock.json

      - name: 构建管理端扫描产物
        working-directory: web/admin-console
        run: |
          npm ci
          npm run build

      - name: 构建用户端扫描产物
        working-directory: web/user-console
        run: |
          npm ci
          npm run build

      - name: 校验 Nginx 来源头安全边界
        run: python infra/nginx/verify_forwarded_headers.py

      - name: 校验短信发布准备度
        shell: pwsh
        run: ./scripts/verify-sms-phase5-readiness.ps1 -SelfTest -RunSensitiveScan

      - name: 校验阶段 5 敏感信息门禁契约
        run: python tests/sms/phase5_sensitive_data_gate_contract.py

      - name: 校验代理专用网络规划
        shell: pwsh
        run: ./scripts/verify-sms-phase5-proxy-network-plan.ps1 -SelfTest

      - name: 校验测试服回滚材料与告警通知只读预检资产
        run: |
          python tests/sms/phase5_recovery_notification_preflight_contract.py
          bash -n scripts/verify-sms-phase5-test-server-recovery-readiness.sh

      - name: 校验阶段 5 固定测试服 SSH 身份共享契约
        run: python tests/sms/phase5_ssh_identity_contract.py

      - name: 校验测试服关闭态只读审计资产
        run: |
          python tests/sms/phase5_test_server_readonly_contract.py
          bash -n scripts/verify-sms-phase5-test-server-readonly.sh

      - name: 离线校验测试服关闭态只读审计包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-readonly.ps1 -SelfTest

      - name: 校验测试服前端部署与自动回滚契约
        run: python tests/sms/phase5_deploy_workflow_contract.py

      - name: 离线校验测试服回滚与通知预检包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-recovery-readiness.ps1 -SelfTest

      - name: 校验测试服回滚候选生成资产
        run: |
          python tests/sms/phase5_rollback_candidate_contract.py
          bash -n scripts/prepare-sms-phase5-test-server-rollback-candidate.sh

      - name: 离线校验测试服回滚候选包装器
        shell: pwsh
        run: ./scripts/prepare-sms-phase5-test-server-rollback-candidate.ps1 -SelfTest

      - name: 校验测试服回滚候选只读验证资产
        run: |
          python tests/sms/phase5_rollback_candidate_verifier_contract.py
          bash -n scripts/verify-sms-phase5-test-server-rollback-candidate.sh
          bash scripts/verify-sms-phase5-test-server-rollback-candidate.sh --self-test

      - name: 离线校验测试服回滚候选只读包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-rollback-candidate.ps1 -SelfTest

      - name: 校验测试服旧二进制回滚与当前版本恢复演练资产
        run: |
          python tests/sms/phase5_rollback_runtime_drill_contract.py
          bash -n scripts/run-sms-phase5-test-server-rollback-drill.sh

      - name: 离线校验测试服回滚恢复演练包装器
        shell: pwsh
        run: ./scripts/prepare-sms-phase5-test-server-rollback-drill.ps1 -ChangeId 20990101T000000Z -SelfTest

      - name: 校验测试服回滚候选暂存与执行后独立验收资产
        run: |
          python tests/sms/phase5_rollback_runtime_evidence_contract.py
          bash -n scripts/stage-sms-phase5-test-server-rollback-drill.sh
          bash -n scripts/verify-sms-phase5-test-server-rollback-drill.sh

      - name: 校验回滚实际执行包装器安全契约
        run: python tests/sms/phase5_rollback_runtime_execution_contract.py

      - name: 离线校验测试服回滚候选暂存包装器
        shell: pwsh
        run: ./scripts/stage-sms-phase5-test-server-rollback-drill.ps1 -SelfTest

      - name: 离线校验测试服回滚执行证据验证器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-rollback-drill.ps1 -SelfTest

      - name: 校验测试服日志留存只读审计资产
        run: |
          python tests/sms/phase5_log_retention_preflight_contract.py
          bash -n scripts/verify-sms-phase5-test-server-log-retention.sh

      - name: 离线校验测试服日志留存审计包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-log-retention.ps1 -SelfTest

      - name: 校验 Alertmanager 通知演练只读预检资产
        run: |
          python tests/sms/phase5_alertmanager_drill_readiness_contract.py
          bash -n scripts/verify-sms-phase5-alertmanager-drill-readiness.sh

      - name: 离线校验 Alertmanager 通知演练只读预检包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-alertmanager-drill-readiness.ps1 -SelfTest

      - name: 校验测试服 Canary 只读聚合预检
        run: python tests/sms/phase5_canary_preflight_contract.py

      - name: 校验 Canary 执行计划与五档观察证据门禁
        run: |
          python tests/sms/phase5_canary_execution_plan_contract.py
          python tests/sms/phase5_canary_plan_candidate_contract.py
          python tests/sms/phase5_canary_target_intake_candidate_contract.py
          python tests/sms/phase5_canary_target_state_readonly_candidate_contract.py
          python tests/sms/phase5_canary_whitelist_change_candidate_contract.py
          python tests/sms/phase5_canary_send_candidate_contract.py
          python tests/sms/phase5_canary_failure_readonly_diagnostic_contract.py
          python tests/sms/phase5_canary_postcheck_readonly_candidate_contract.py
          python tests/sms/phase5_enabled_startup_readonly_diagnostic_contract.py
          python tests/sms/phase5_legacy_config_cleanup_candidate_contract.py
          python tests/sms/phase5_observation_evidence_contract.py
          python tests/sms/phase5_observation_progress_contract.py
          python tests/sms/phase5_observation_assembler_contract.py
          python tests/sms/phase5_final_state_assembler_contract.py
          python tests/sms/phase5_observation_snapshot_candidate_contract.py
          python tests/sms/phase5_production_target_intake_candidate_contract.py
          python tests/sms/phase5_production_readonly_baseline_candidate_contract.py
          python tests/sms/phase5_production_closed_deployment_plan_contract.py

      - name: 离线校验测试服 Canary 聚合预检包装器
        shell: pwsh
        run: ./scripts/verify-sms-phase5-test-server-canary-preflight.ps1 -SelfTest

      - name: 校验测试服日志留存变更资产
        run: |
          python tests/sms/phase5_log_retention_change_contract.py
          bash -n scripts/apply-sms-phase5-test-server-log-retention.sh
          bash scripts/apply-sms-phase5-test-server-log-retention.sh --self-test

      - name: 离线校验测试服日志留存变更包装器
        shell: pwsh
        run: ./scripts/apply-sms-phase5-test-server-log-retention.ps1 -SelfTest

      # 测试服只读审计依赖专用 SSH 凭据，不在不可信 PR 上自动连接外部环境；部署窗口由运维手工执行对应脚本。

      - name: 使用 promtool 校验告警规则
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            --workdir=/rules \
            -v "${{ github.workspace }}/infra/prometheus:/rules:ro" \
            prom/prometheus:v3.12.0-distroless \
            check rules email-alerts.yml
          docker run --rm --entrypoint=/bin/promtool \
            --workdir=/rules \
            -v "${{ github.workspace }}/infra/prometheus:/rules:ro" \
            prom/prometheus:v3.12.0-distroless \
            test rules email-alerts.test.yml

      - name: 演练测试服与生产关闭回滚
        shell: pwsh
        run: |
          ./scripts/verify-sms-phase5-rollback-dry-run.ps1 -Environment test -CurrentSmsEnabled false
          ./scripts/verify-sms-phase5-rollback-dry-run.ps1 -Environment production -CurrentSmsEnabled true

