name: 部署测试环境

# 合并到 main 后自动部署到测试服务器
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: 部署到测试环境
    runs-on: ubuntu-latest

    steps:
      - name: 通过 SSH 部署到测试服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USER }}
          key:      ${{ secrets.TEST_SERVER_SSH_KEY }}
          port:     ${{ secrets.TEST_SERVER_PORT || 22 }}
          # 部署步骤：拉取最新代码 → 重新构建镜像 → 滚动重启服务
          script: |
            set -euo pipefail

            PROJECT_DIR="${{ secrets.TEST_PROJECT_DIR || '/opt/molin' }}"
            cd "$PROJECT_DIR"

            echo "=== 拉取最新代码 ==="
            git pull origin main

            echo "=== 执行数据库 Migration ==="
            # 加载测试环境变量后执行 migration
            export $(grep -v '^#' .env.test | xargs)
            ./scripts/migrate.sh up

            echo "=== 重新构建并启动服务 ==="
            docker compose -f infra/docker-compose.prod.yml \
              --env-file .env.test \
              up -d --build --remove-orphans

            echo "=== 等待 API 健康检查通过 ==="
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/api/health > /dev/null; then
                echo "API 健康检查通过"
                break
              fi
              echo "等待服务启动（${i}/12）..."
              sleep 5
            done

            echo "=== 清理旧镜像 ==="
            docker image prune -f

            echo "=== 部署完成 ==="
