services:
  mysql:
    image: mysql:8.0
    container_name: molin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: molin
      MYSQL_USER: molin
      MYSQL_PASSWORD: molin_password
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: molin-redis
    ports:
      - "16379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: molin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: molin
      RABBITMQ_DEFAULT_PASS: molin_password
    ports:
      - "5673:5672"
      - "15673:15672"

  minio:
    image: minio/minio
    container_name: molin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: molin
      MINIO_ROOT_PASSWORD: molin_password
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

  prometheus:
    image: prom/prometheus:v3.12.0-distroless
    container_name: molin-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    ports:
      # 测试监控界面只绑定本机回环，禁止直接暴露到公网。
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    extra_hosts:
      # 测试服务器 API 是宿主机二进制，不是 Compose 内的 api 服务。
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/email-alerts.yml:/etc/prometheus/rules/email-alerts.yml:ro
      - ./prometheus/ai-gateway-alerts.yml:/etc/prometheus/rules/ai-gateway-alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    secrets:
      - source: internal_api_token
        target: internal_api_token
        uid: "65532"
        gid: "65532"
        mode: 0o400
    networks:
      monitoring:
        # 固定测试容器地址，便于 INTERNAL_ALLOWED_IPS 精确放行。
        ipv4_address: ${PROMETHEUS_CONTAINER_IP:-172.31.250.10}
    security_opt:
      - no-new-privileges:true

  blackbox-exporter:
    # 固定官方 0.28.0；仅执行测试内网 HTTP 2xx 探测，不携带 Bifrost 内部 Token 或上游密钥。
    image: prom/blackbox-exporter:v0.28.0
    container_name: molin-blackbox-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      monitoring:
        ipv4_address: ${BLACKBOX_CONTAINER_IP:-172.31.250.12}
    security_opt:
      - no-new-privileges:true

  grafana:
    # Grafana 13.1.3 是 2026-08-08 官方发布的稳定 OSS 版本，固定版本避免 latest 漂移。
    image: grafana/grafana:13.1.3
    container_name: molin-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # 测试仪表盘只绑定本机回环；远程查看必须使用受控 SSH 隧道。
      - "127.0.0.1:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      monitoring:
        ipv4_address: ${GRAFANA_CONTAINER_IP:-172.31.250.11}
    security_opt:
      - no-new-privileges:true

volumes:
  mysql-data:
  minio-data:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROMETHEUS_SUBNET:-172.31.250.0/24}

# Compose 从启动进程的环境变量创建只读 secret 文件，不把 Token 写入本文件或容器环境变量。
secrets:
  internal_api_token:
    environment: INTERNAL_API_TOKEN
