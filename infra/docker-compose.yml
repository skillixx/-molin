services:
  mysql:
    image: mysql:8.0
    container_name: molin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: molin
      MYSQL_USER: molin
      MYSQL_PASSWORD: molin_password
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    container_name: molin-redis
    ports:
      - "16379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: molin-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: molin
      RABBITMQ_DEFAULT_PASS: molin_password
    ports:
      - "5673:5672"
      - "15673:15672"

  minio:
    image: minio/minio
    container_name: molin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: molin
      MINIO_ROOT_PASSWORD: molin_password
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
