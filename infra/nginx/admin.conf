server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 管理入口同样阻断可触发上游调用的路径，避免从另一公开端口绕过保险丝。
    include /etc/nginx/ai-gateway-traffic-gate/*.conf;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router history 模式：所有非文件路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 管理后台不承载一次性 bootstrap，避免内部入口因通用 /api/ 规则暴露到公网。
    location ^~ /api/internal/email/bootstrap/admin-verify {
        return 404;
    }

    location = /api/internal/metrics {
        return 404;
    }

    # Nginx 核心会在进入普通 location 前拒绝 TRACE；仅对该关闭路径把核心 405 收敛为 404。
    error_page 405 = @bootstrap_path_not_found;
    location @bootstrap_path_not_found {
        if ($uri = "/api/internal/email/bootstrap/admin-verify") {
            return 404;
        }
        return 405;
    }

    # 反向代理到后端 API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;

        # 覆盖真实来源地址，并删除客户端可伪造的转发链头，供后端可信代理校验使用
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
    }
}
