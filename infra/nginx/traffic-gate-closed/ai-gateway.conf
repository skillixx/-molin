# 应用版本之外的商业流量保险丝；回滚、账务异常或安全事件期间保持关闭。
location = /v1/chat/completions {
    default_type application/json;
    return 503 '{"code":50330,"message":"AI 网关商业流量暂未开放"}';
}

location = /api/token/chat/completions {
    default_type application/json;
    return 503 '{"code":50330,"message":"AI 网关商业流量暂未开放"}';
}

location ~ ^/api/agents/[^/]+/chat$ {
    default_type application/json;
    return 503 '{"code":50330,"message":"AI 网关商业流量暂未开放"}';
}

location ~ ^/api/conversations/[^/]+/chat$ {
    default_type application/json;
    return 503 '{"code":50330,"message":"AI 网关商业流量暂未开放"}';
}
