# API 反向代理 Nginx 配置
# 独立部署 API 网关时使用；若前端容器已内置 /api/ 代理则无需单独挂载此文件

upstream molin_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 请求体大小限制（文件上传场景）
    client_max_body_size 20m;

    # 一次性 admin_verify bootstrap 仅允许受控运维直连，公网 API 网关始终伪装为不存在。
    location ^~ /api/internal/email/bootstrap/admin-verify {
        return 404;
    }

    # 内部指标只允许监控专网直连 API，不经公网 Nginx 暴露。
    location = /api/internal/metrics {
        return 404;
    }

    # OpenAI 兼容入口支持长连接 SSE；关闭响应缓冲，避免首包和分片被代理聚合。
    location /v1/ {
        proxy_pass         http://molin_api;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header Forwarded         "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 只转发 /api/ 路径
    location /api/ {
        proxy_pass         http://molin_api;
        proxy_http_version 1.1;
        proxy_buffering    off;

        proxy_set_header Host              $host;

        # 覆盖真实来源地址，并删除客户端可伪造的转发链头，供后端可信代理校验使用
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   "";
        proxy_set_header Forwarded         "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 超时：普通接口 60s，上传接口可在对应 location 里覆盖
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 隐藏后端版本信息
        proxy_hide_header X-Powered-By;
    }

    # 健康检查端点（负载均衡器探活）
    location = /api/health {
        proxy_pass http://molin_api;
        proxy_set_header Host $host;

        # 健康检查也使用相同的来源头边界，避免该入口成为伪造头旁路
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        access_log off;
    }

    # 其余路径一律 404，不暴露目录结构
    location / {
        return 404;
    }
}
