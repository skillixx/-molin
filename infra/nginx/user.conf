server {
    listen 80;
    server_name _;
    # 与独立 API 网关保持一致，限制文字模型和控制台请求体上限，避免生产入口沿用 Nginx 默认 1m。
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # G8 商业流量保险丝独立于应用版本，确保旧制品回滚期间仍保持失败关闭。
    include /etc/nginx/ai-gateway-traffic-gate/*.conf;

    location ~* \.(js|css|png|jpg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户控制台永不转发内部 bootstrap 路径，统一返回 404 且不泄露启用状态。
    location ^~ /api/internal/email/bootstrap/admin-verify {
        return 404;
    }

    location = /api/internal/metrics {
        return 404;
    }

    # Nginx 核心会在进入普通 location 前拒绝 TRACE；仅对该关闭路径把核心 405 收敛为 404。
    error_page 405 = @bootstrap_path_not_found;
    location @bootstrap_path_not_found {
        if ($uri = "/api/internal/email/bootstrap/admin-verify") {
            return 404;
        }
        return 405;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;

        # 覆盖真实来源地址，并删除客户端可伪造的转发链头，供后端可信代理校验使用
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";

        # 支持 Token 网关流式响应（SSE），禁用 proxy 缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # OpenAI 兼容 SDK 入口与 /api/token/chat/completions 使用同一 SSE 代理边界。
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
