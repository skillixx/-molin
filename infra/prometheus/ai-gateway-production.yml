# AI 网关 G8 生产形态 Prometheus 配置。
# 指标 Token 仅从只读 secret 文件读取；本文件不保存真实凭据或联系人。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/ai-gateway-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: molin-ai-gateway
    metrics_path: /api/internal/metrics
    scheme: http
    scrape_timeout: 5s
    http_headers:
      X-Internal-Token:
        files: [/run/secrets/internal_api_token]
    static_configs:
      - targets: ["api:8080"]
        labels:
          environment: production

  - job_name: molin-bifrost-node
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: [/etc/prometheus/targets/bifrost-nodes-production.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
