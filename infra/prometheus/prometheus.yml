# Molin 测试环境 Prometheus 配置。
# 内部 Token 由 Docker Compose secret 挂载，禁止在本文件写入任何凭据。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: molin-email-adapter
    metrics_path: /api/internal/metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 5s
    http_headers:
      X-Internal-Token:
        files:
          - /run/secrets/internal_api_token
    static_configs:
      # 测试服务器 API 以宿主机二进制运行，容器通过 host-gateway 访问。
      - targets:
          - host.docker.internal:8080
        labels:
          environment: test

  # Bifrost 节点使用 Blackbox HTTP 探测；测试环境部署时需把 exporter 接入 bifrost-net。
  - job_name: molin-bifrost-node
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/bifrost-nodes.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
