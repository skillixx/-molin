# G8 生产形态告警分级路由。
# 当前只投递到隔离网络内的 alert-relay；真实短信、邮件、电话或工单接收人需另行授权并配置在 relay 中。
route:
  receiver: discard
  group_by: [alertname, p_level]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m
  routes:
    - matchers: ['p_level="P0"']
      receiver: ai-gateway-p0-relay
      repeat_interval: 10m
    - matchers: ['p_level="P1"']
      receiver: ai-gateway-p1-relay
      repeat_interval: 30m

receivers:
  - name: discard
  - name: ai-gateway-p0-relay
    webhook_configs:
      - url: http://alert-relay:8080/alerts/p0
        send_resolved: true
  - name: ai-gateway-p1-relay
    webhook_configs:
      - url: http://alert-relay:8080/alerts/p1
        send_resolved: true

inhibit_rules:
  - source_matchers: ['p_level="P0"']
    target_matchers: ['p_level="P1"']
    equal: [alertname]
